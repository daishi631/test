<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>2027 SEC</title>

    <!-- iOS PWA settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="2027 SEC">
    
    <!-- Logic Pro style Placeholder Icon -->
    <link rel="apple-touch-icon" href="https://via.placeholder.com/180/121212/00d1ff?text=2027">

    <style>
        :root {
            --bg-color: #000000;
            --lcd-bg: #111111;
            --accent-cyan: #00d1ff;
            --text-dim: #555555;
            --text-main: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            -webkit-user-select: none;
        }

        .lcd-panel {
            background-color: var(--lcd-bg);
            padding: 40px 20px;
            border-radius: 24px;
            border: 1px solid #222;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 10px 40px rgba(0,0,0,0.8);
            text-align: center;
            width: 85%;
            max-width: 350px;
        }

        .header-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-dim);
            margin-bottom: 20px;
        }

        #counter {
            font-size: 3.8rem;
            font-weight: 700;
            color: var(--accent-cyan);
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 15px rgba(0, 209, 255, 0.4);
            letter-spacing: -1px;
            margin: 10px 0;
            display: block;
        }

        .unit {
            font-size: 12px;
            color: var(--text-dim);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .footer-info {
            margin-top: 30px;
            font-size: 9px;
            color: #333;
            border-top: 1px solid #1a1a1a;
            padding-top: 15px;
        }

        .message {
            color: var(--accent-cyan);
            font-size: 1.5rem;
            display: none;
        }
    </style>
</head>
<body>

    <div class="lcd-panel">
        <div class="header-label">Countdown to 2027.01.16</div>
        
        <div id="display-group">
            <span id="counter">0</span>
            <span class="unit">Seconds Remaining</span>
        </div>

        <div id="complete-msg" class="message">PROJECT COMPLETE</div>

        <div class="footer-info">Target: 09:30:00 JST</div>
    </div>

    <script>
        const target = new Date(2027, 0, 16, 9, 30, 0).getTime();

        function tick() {
            const now = new Date().getTime();
            const diff = target - now;

            if (diff <= 0) {
                document.getElementById('display-group').style.display = 'none';
                document.getElementById('complete-msg').style.display = 'block';
                return;
            }

            const secs = Math.floor(diff / 1000);
            document.getElementById('counter').innerText = secs.toLocaleString();
        }

        setInterval(tick, 1000);
        tick();

        // Prevent bounce on iOS
        document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
    </script>
</body>
</html>
